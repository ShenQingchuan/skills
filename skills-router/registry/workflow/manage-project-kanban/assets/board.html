<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目看板</title>
  
  <!-- 极简矢量 SVG Favicon (Data URI 0 外部依赖) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='3'/><path d='M8 7v7'/><path d='M12 7v4'/><path d='M16 7v9'/></svg>" type="image/svg+xml" />

  <!-- 纯原生精雕样式 (0 第三方框架依赖) -->
  <link href="./kanban-style.css" rel="stylesheet" />
</head>
<body>

  <!-- 极简通透顶栏：品牌与极简语言切换器 -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="3"></rect>
            <path d="M8 7v7"></path>
            <path d="M12 7v4"></path>
            <path d="M16 7v9"></path>
          </svg>
        </span>
        <span class="brand-name" id="brand-title">项目看板</span>
      </div>

      <nav class="nav-actions">
        <button class="btn-lang" id="btn-lang-toggle" title="切换语言 / Switch Language">EN</button>
      </nav>
    </div>
  </header>

  <!-- 主体工作区：无边框纯净舒展画布 -->
  <main class="canvas-wrapper">
    <div id="kanban-mount">
      <!-- Pele 渲染的 SVG 将挂载于此 -->
    </div>
  </main>

  <!-- ==============================================================================
       数据源定义：AI 直接维护与编辑下方的 Mermaid Kanban 纯文本
       泳道标签会自动由内置 i18n 引擎动态映射为当前语言
       ============================================================================== -->
  <script type="text/mermaid" id="kanban-source">
kanban
  backlog[需求池]
    feat001[支持微信与飞书多端授权登录]
    perf002[针对大型 SVG 画板进行渲染性能调优]
  todo[待开发]
    feat003[增加看板数据导出为 JSON 功能]@{ priority: "High" }
  in_progress[进行中]
    feat006[国际化多语言支持]@{ assigned: "AI", priority: "High" }
  ready_for_review[待验收]
    work004[升级鉴权链路与会话状态管理]
  </script>

  <!-- 看板核心引擎应用 (含内置 i18n) -->
  <script type="module" src="./kanban-app.js"></script>

</body>
</html>
