<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>项目看板</title>
  
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><style>@media (prefers-color-scheme: dark){:root{stroke:%23fff}}</style><rect width='18' height='18' x='3' y='3' rx='3'/><path d='M8 7v7'/><path d='M12 7v4'/><path d='M16 7v9'/></svg>" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="./kanban-style.css" rel="stylesheet" />
</head>
<body data-theme="dark">

  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="3"></rect>
            <path d="M8 7v7"></path>
            <path d="M12 7v4"></path>
            <path d="M16 7v9"></path>
          </svg>
        </span>
        <span class="brand-name" id="brand-title">项目看板</span>
      </div>

      <nav class="nav-actions">
        <!-- 语言切换 (ant-design:translation-outlined) -->
        <button class="btn-icon-action" id="btn-lang-toggle" title="切换语言 (中 / EN)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 1024 1024">
            <path fill="currentColor" d="M140 188h584v164h76V144c0-17.7-14.3-32-32-32H96c-17.7 0-32 14.3-32 32v736c0 17.7 14.3 32 32 32h544v-76H140z"/>
            <path fill="currentColor" d="M414.3 256h-60.6c-3.4 0-6.4 2.2-7.6 5.4L219 629.4c-.3.8-.4 1.7-.4 2.6c0 4.4 3.6 8 8 8h55.1c3.4 0 6.4-2.2 7.6-5.4L322 540h196.2L422 261.4c-1.3-3.2-4.3-5.4-7.7-5.4m12.4 228h-85.5L384 360.2zM936 528H800v-93c0-4.4-3.6-8-8-8h-56c-4.4 0-8 3.6-8 8v93H592c-13.3 0-24 10.7-24 24v176c0 13.3 10.7 24 24 24h136v152c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8V752h136c13.3 0 24-10.7 24-24V552c0-13.3-10.7-24-24-24M728 680h-88v-80h88zm160 0h-88v-80h88z"/>
          </svg>
        </button>

        <!-- 主题切换 -->
        <button class="btn-icon-action" id="btn-theme-toggle" title="切换模式 (浅色 / 深色)">
        </button>
      </nav>
    </div>
  </header>

  <main class="canvas-wrapper">
    <div id="kanban-mount">
    </div>
  </main>

  <!-- 任务详情抽屉 -->
  <div class="drawer-backdrop" id="drawer-backdrop">
    <div class="task-drawer" id="task-drawer">
      <div class="drawer-header">
        <button class="drawer-close-btn" id="btn-drawer-close" aria-label="关闭">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="drawer-content">
        <div class="drawer-task-id" id="drawer-task-id-text">FEAT-006</div>
        <h2 class="drawer-task-title" id="drawer-task-title-text">国际化多语言支持</h2>

        <div class="properties-grid">
          <span class="prop-label" id="label-priority">优先级</span>
          <span class="prop-value" id="drawer-prop-priority">High</span>

          <span class="prop-label" id="label-assignee">负责人</span>
          <span class="prop-value" id="drawer-prop-assignee">AI Agent</span>

          <span class="prop-label" id="label-status">当前阶段</span>
          <span class="prop-value" id="drawer-prop-lane">进行中</span>
        </div>

        <div class="timeline-section-title" id="drawer-timeline-title">历史日志</div>
        <div class="timeline-list" id="drawer-timeline">
        </div>
      </div>
    </div>
  </div>

  <script type="text/mermaid" id="kanban-source">
kanban
  backlog[待处理]
    feat001[支持微信与飞书多端授权登录]
    perf002[针对大型 SVG 画板进行渲染性能调优]
  todo[待开发]
    feat003[增加看板数据导出为 JSON 功能]@{ priority: "High" }
  in_progress[进行中]
    feat006[国际化多语言支持]@{ assigned: "AI", priority: "High" }
  ready_for_review[待验收]
    work004[升级鉴权链路与会话状态管理]
  </script>

  <script type="module" src="./kanban-app.js"></script>

</body>
</html>
