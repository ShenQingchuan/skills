name: Close Pull Requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR with explanation
        uses: actions/github-script@v7
        with:
          script: |
            const message = `你好！感谢对本项目的关注与支持。

本项目是一个高度个人化的技能库（比较 opinionated），服务于个人的特定使用习惯，因此**不接收外部 Pull Request**。

- 💬 如果发现 Bug、规则缺陷或有建设性意见，非常欢迎前往 [Issues](../../issues) 发起讨论；
- 🍴 如果你有自己的定制需求，**feel free to fork** 进行二次开发与独立维护！

本 PR 将自动关闭，感谢理解！`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
